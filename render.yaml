services:
  - type: web
    name: bamfit-api
    env: node
    buildCommand: npm ci
    startCommand: node contact-server.js
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: contact@bamfit1.com
      - key: ADMIN_SECRET
        sync: false
      - key: STRIPE_CONNECT_CLIENT_ID
        sync: false
      - key: OWNER_EMAIL
        value: contact@bamfit1.com
      - key: FRONTEND_URL
        value: https://bamfit1.com
      - key: FRONTEND_URLS
        value: https://bamfit1.com,https://www.bamfit1.com,https://bamfit.onrender.com
      - key: API_ORIGIN
        value: https://bamfit-contact-api.onrender.com
